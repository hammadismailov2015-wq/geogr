<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>МатШахи · с ботом, с другом и рядом</title>
  <meta name="description" content="МатШахи: игра с ботом, с другом онлайн или рядом друг с другом. Устанавливается как приложение." />

  <!-- Устанавливаемое приложение (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="application-name" content="МатШахи" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="МатШахи" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <script>
    // Подключаем стили со свежей версией, чтобы не оставался старый кэш.
    (function () {
      var online = location.protocol === "http:" || location.protocol === "https:";
      var href = "chess.css" + (online ? "?v=" + Date.now() : "");
      document.write('<link rel="stylesheet" href="' + href + '">');
    })();
  </script>
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>
<body data-chess-theme="classic">
  <header class="ch-topbar">
    <div class="ch-brand">
      <span class="k">♞</span>
      <div>
        <h1>МатШахи</h1>
        <p>С ботом · С другом · Рядом</p>
      </div>
    </div>
  </header>

  <main>
    <div id="chessRoot"><!-- интерфейс собирается из chess-ui.js --></div>
  </main>

  <!-- Библиотека для онлайн-игры с другом (MQTT поверх WebSocket) -->
  <script src="mqtt.min.js"></script>
  <script>
    // Подключаем скрипты со свежей версией, чтобы браузер не держал
    // старый кэш после обновлений (на file:// версию не добавляем).
    (function () {
      var online = location.protocol === "http:" || location.protocol === "https:";
      var v = online ? "?v=" + Date.now() : "";
      document.write('<script src="chess.js' + v + '"><\/script>');
      document.write('<script src="chess-ui.js' + v + '"><\/script>');
    })();
  </script>
  <script>
    // Регистрируем сервис-воркер — чтобы приложение можно было установить
    // и открывать без браузера (на http/https, не на file://).
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
