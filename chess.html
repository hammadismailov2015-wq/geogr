<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шахматы · с ботом, с другом и рядом</title>
  <meta name="description" content="Шахматы в браузере: игра с ботом, с другом по ссылке или рядом друг с другом. Выбор стороны и тем доски." />
  <script>
    // Подключаем стили со свежей версией, чтобы не оставался старый кэш.
    (function () {
      var online = location.protocol === "http:" || location.protocol === "https:";
      var href = "chess.css" + (online ? "?v=" + Date.now() : "");
      document.write('<link rel="stylesheet" href="' + href + '">');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
</head>
<body data-chess-theme="classic">
  <header class="ch-topbar">
    <div class="ch-brand">
      <span class="k">♞</span>
      <div>
        <h1>Шахматы</h1>
        <p>С ботом · С другом · Рядом</p>
      </div>
    </div>
  </header>

  <main>
    <div id="chessRoot"><!-- интерфейс собирается из chess-ui.js --></div>
  </main>

  <!-- Библиотека для онлайн-игры с другом (MQTT поверх WebSocket) -->
  <script src="mqtt.min.js"></script>
  <script>
    // Подключаем скрипты со свежей версией, чтобы браузер не держал
    // старый кэш после обновлений (на file:// версию не добавляем).
    (function () {
      var online = location.protocol === "http:" || location.protocol === "https:";
      var v = online ? "?v=" + Date.now() : "";
      document.write('<script src="chess.js' + v + '"><\/script>');
      document.write('<script src="chess-ui.js' + v + '"><\/script>');
    })();
  </script>
</body>
</html>
